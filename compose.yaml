services:

  mongo:
    image: mongo:7
    container_name: payment-service-db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-paymentdb}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: payment-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: payment-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build: .
    container_name: payment-service-microservice
    ports:
      - "${APP_PORT:-8084}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGO_DB_URI: ${MONGO_DB_URI}
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVICES}
      JWT_SECRET: ${JWT_SECRET:-my-secret-key}
      RANDOM_NUMBER: ${RANDOM_NUMBER:-https://www.random.org/integers/?num=1&min=1&max=100&col=1&base=10&format=plain}

    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy